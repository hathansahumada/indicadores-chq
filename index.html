<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1937">
<title>Indicadores CHQ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#0E1937;color:#e8eaf6;min-height:100vh}
.header{background:#132044;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 16px;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:50px;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,#38bdf8,#3b82f6);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.logo-text{font-size:14px;font-weight:600}
.badge-live{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.main{max-width:1200px;margin:0 auto;padding:12px 16px}
.date-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:#132044;border-radius:8px;border:1px solid rgba(255,255,255,0.08)}
.date-bar input[type=date]{background:#1a2a52;color:#e8eaf6;border:0.5px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 8px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer}
.date-bar input[type=date]:focus{outline:none;border-color:#38bdf8}
.titulo-saidi{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:0.3px}
.saidi-panel{display:grid;grid-template-columns:150px 1fr;gap:0;margin-bottom:12px;background:#132044;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden}
.kpi-col{display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.08)}
.kpi-card{flex:1;padding:14px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative}
.kpi-card:last-child{border-bottom:none}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi-card.red::before{background:#ef4444}
.kpi-card.green::before{background:#10b981}
.kpi-label{font-size:11px;color:#8892bb;line-height:1.3;margin-bottom:6px}
.kpi-value{font-size:34px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-2px;line-height:1}
.kpi-value.red{color:#ef4444}
.kpi-value.green{color:#10b981}
.chart-col{padding:10px 12px 8px;display:flex;flex-direction:column;gap:4px}
.chart-col-title{font-size:11px;color:#8892bb;font-weight:600;text-align:center}
.leg-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#8892bb}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}








.section{background:#132044;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;margin-bottom:12px}
.section-title{font-size:12px;font-weight:600;color:#8892bb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.fm-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:7px}
.fm-bar label{font-size:11px;color:#8892bb;font-weight:600;white-space:nowrap}
.fm-bar input[type=date]{background:#1a2a52;color:#e8eaf6;border:0.5px solid rgba(255,255,255,0.12);border-radius:5px;padding:3px 7px;font-size:11px;font-family:'JetBrains Mono',monospace}
.fm-tag{font-size:10px;color:#56B4D3;font-family:'JetBrains Mono',monospace}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#8892bb}
.legend-dot{width:9px;height:9px;border-radius:2px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-scroll::-webkit-scrollbar{height:4px}
.chart-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
.footer{text-align:center;padding:14px;font-size:10px;color:#4a5578;font-family:'JetBrains Mono',monospace}
@media(max-width:700px){.saidi-panel{grid-template-columns:110px 1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo"><div class="logo-icon">⚡</div><div class="logo-text">Indicadores CHQ</div></div>
    <div class="badge-live"><div class="dot"></div>EN VIVO</div>
  </div>
</div>
<div class="main">
  <div class="date-bar">
    <input type="date" id="sel-desde" onchange="onDateChange()">
    <input type="date" id="sel-hasta" onchange="onDateChange()">
    <div class="titulo-saidi" id="titulo-año">SAIDI AÑO 2026</div>
  </div>
  <div class="saidi-panel">
    <div class="kpi-col">
      <div class="kpi-card red"><div class="kpi-label">SAIDI Lo que ve el Cliente</div><div class="kpi-value red" id="kpi-cliente">—</div></div>
      <div class="kpi-card green"><div class="kpi-label">SAIDI Distribución</div><div class="kpi-value green" id="kpi-dist">—</div></div>
    </div>
    <div class="chart-col">
      <div class="chart-col-title">SAIDI Lo que ve el Cliente</div>
      <div class="leg-row">
        <div class="leg-item"><div class="leg-dot" style="background:#56B4D3"></div>1-Interna</div>
        <div class="leg-item"><div class="leg-dot" style="background:#F5C842"></div>3-FM</div>
        <div class="leg-item"><div class="leg-dot" style="background:#4CAF82"></div>Dx_prog</div>
        <div class="leg-item"><div class="leg-dot" style="background:#E05C5C"></div>EXT</div>
      </div>
      <div style="position:relative;flex:1;min-height:90px"><canvas id="chartEmpresa"></canvas></div>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">SAIDI comunas — 12 meses acumulado</div>
    <div class="fm-bar">
      <label>FM:</label>
      <input type="date" id="fm-desde" onchange="fmChanged()">
      <span style="font-size:11px;color:#8892bb">→</span>
      <input type="date" id="fm-hasta" onchange="fmChanged()">
      <span id="fm-tag" class="fm-tag"></span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4CAF82"></div>Interna (12m)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#56B4D3"></div>Fuerza Mayor</div>
      <div class="legend-item"><div style="width:16px;height:2px;border-top:2px dashed #ef4444"></div>Límite</div>
    </div>
    <div class="chart-scroll"><canvas id="chartComunas"></canvas></div>
  </div>
</div>
<div class="footer" id="footer"></div>

const FECHA_MAX = '2026-05-18';
const FM_DESDE_DEF = (function(){
  var d=new Date(FECHA_MAX+'T00:00:00');
  return new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,10);
})();
const FM_HASTA_DEF = (function(){
  var d=new Date(FECHA_MAX+'T00:00:00');
  return new Date(d.getFullYear(),d.getMonth(),0).toISOString().slice(0,10);
})();
const COLORES = ['#3b82f6','#8b5cf6','#f59e0b','#10b981','#ef4444','#06b6d4','#f97316','#84cc16','#ec4899','#6366f1','#14b8a6','#a855f7','#eab308','#22c55e','#f43f5e'];

var chEmp=null,chCom=null;

function calcEmpresa(desde,hasta){
  var i=0,f=0,e=0,d=0;
  Object.entries(DIARIO).forEach(function(kv){
    var fec=kv[0],vs=kv[1];
    if(fec>=desde&&fec<=hasta){i+=vs.interna||0;f+=vs.fm||0;e+=vs.ext||0;d+=vs.dx||0;}
  });
  return {interna:i,fm:f,ext:e,dx:d,cliente:i+f+e+d,dist:i+f+d};
}

function calcFM(d,h){
  var fm={};
  Object.entries(FM_COMPACT).forEach(function(kv){
    var f=kv[0],cs=kv[1];
    if(f>=d&&f<=h) Object.entries(cs).forEach(function(cv){fm[cv[0]]=(fm[cv[0]]||0)+cv[1];});
  });
  return fm;
}

function getComunas(d,h){
  var fm=calcFM(d,h);
  return COMUNAS_BASE.map(function(c){
    var fmv=Math.round((fm[c.comuna]||0)*1000)/1000;
    var tot=Math.round((c.interna+fmv+c.ext)*1000)/1000;
    return Object.assign({},c,{fm:fmv,total:tot,supera:tot>c.limite_saidi});
  });
}

function renderEmpresa(v){
  document.getElementById('kpi-cliente').textContent=v.cliente.toFixed(2);
  document.getElementById('kpi-dist').textContent=v.dist.toFixed(2);
  if(chEmp) chEmp.destroy();
  var segPlugin={id:'sl',afterDatasetsDraw:function(chart){
    var ctx=chart.ctx;
    chart.data.datasets.forEach(function(_,di){
      var meta=chart.getDatasetMeta(di);
      meta.data.forEach(function(bar,i){
        var val=chart.data.datasets[di].data[i];
        if(!val||val<0.01) return;
        var h=Math.abs(bar.base-bar.y);
        if(h<14) return;
        ctx.save();ctx.fillStyle='#fff';ctx.font='bold 10px JetBrains Mono,monospace';
        ctx.textAlign='center';ctx.fillText(val.toFixed(2),bar.x,(bar.y+bar.base)/2+4);ctx.restore();
      });
    });
  }};
  chEmp=new Chart(document.getElementById('chartEmpresa').getContext('2d'),{
    type:'bar',plugins:[segPlugin],
    data:{labels:[''],datasets:[
      {label:'1-Interna',    data:[Math.round(v.interna*1000)/1000], backgroundColor:'#56B4D3',barThickness:35},
      {label:'3-Fuerza Mayor',data:[Math.round(v.fm*1000)/1000],    backgroundColor:'#F5C842',barThickness:35},
      {label:'Dx_programada',data:[Math.round(v.dx*1000)/1000],     backgroundColor:'#4CAF82',barThickness:35},
      {label:'EXT',          data:[Math.round(v.ext*1000)/1000],    backgroundColor:'#E05C5C',barThickness:35},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#132044',titleColor:'#e8eaf6',bodyColor:'#8892bb'}},
      scales:{
        x:{stacked:true,ticks:{color:'#8892bb',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}},
        y:{stacked:true,ticks:{color:'#8892bb',font:{size:10}},grid:{color:'rgba(255,255,255,0.06)'}}
      }
    }
  });
}







function renderComunas(fmD,fmH){
  var comunas=getComunas(fmD,fmH);
  var labels=comunas.map(function(c){return c.comuna;});
  var limites=comunas.map(function(c){return c.limite_saidi;});
  var plugin={id:'lbl',afterDraw:function(ch){
    var ctx=ch.ctx,mLin=ch.getDatasetMeta(2),mInt=ch.getDatasetMeta(0),mFM=ch.getDatasetMeta(1);
    var prevD=null;
    comunas.forEach(function(c,i){
      if(c.densidad!==prevD){
        var pt=mLin.data[i];
        if(pt){ctx.save();ctx.fillStyle='#ff6b6b';ctx.font='bold 9px Space Grotesk,sans-serif';ctx.textAlign='left';ctx.fillText('D.'+c.densidad_nombre+' '+c.limite_saidi+'h',pt.x+3,pt.y-5);ctx.restore();}
        prevD=c.densidad;
      }
    });
    function seg(meta,vals,col){meta.data.forEach(function(bar,i){var v=vals[i];if(!v||v<0.05)return;var h=Math.abs(bar.base-bar.y);if(h<11)return;ctx.save();ctx.fillStyle=col;ctx.font='bold 8px JetBrains Mono,monospace';ctx.textAlign='center';ctx.fillText(v.toFixed(1),bar.x,(bar.y+bar.base)/2+3.5);ctx.restore();});}
    seg(mInt,comunas.map(function(c){return c.interna;}),'#fff');
    seg(mFM,comunas.map(function(c){return c.fm;}),'#fff');
    mInt.data.forEach(function(bar,i){var c=comunas[i];var yT=ch.scales.y.getPixelForValue(c.total);ctx.save();ctx.fillStyle=c.supera?'#ff6b6b':'#8892bb';ctx.font='bold 9px JetBrains Mono,monospace';ctx.textAlign='center';ctx.fillText(c.total.toFixed(1),bar.x,yT-4);ctx.restore();});
  }};
  if(chCom) chCom.destroy();
  var wrap=document.querySelector('.chart-scroll');
  var cw=Math.max(comunas.length*46,wrap?wrap.offsetWidth:700);
  var canvas=document.getElementById('chartComunas');
  canvas.style.width=cw+'px';canvas.style.height='300px';canvas.width=cw;canvas.height=300;
  chCom=new Chart(canvas.getContext('2d'),{
    type:'bar',plugins:[plugin],
    data:{labels:labels,datasets:[
      {label:'Interna',data:comunas.map(function(c){return c.interna;}),backgroundColor:'#4CAF82',stack:'s',order:1},
      {label:'Fuerza Mayor',data:comunas.map(function(c){return c.fm;}),backgroundColor:'#56B4D3',stack:'s',order:1},
      {label:'Límite',data:limites,type:'line',borderColor:'#ef4444',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,stepped:'before',order:0},
    ]},
    options:{responsive:false,maintainAspectRatio:false,
      layout:{padding:{top:30,right:16}},
      plugins:{legend:{display:false},tooltip:{
        callbacks:{
          label:function(i){return i.dataset.label==='Límite'?'Límite: '+i.raw+' hrs':i.dataset.label+': '+Number(i.raw).toFixed(2)+' hrs';},
          afterBody:function(items){var c=comunas[items[0].dataIndex];return['Total: '+c.total.toFixed(2)+' hrs','Densidad: '+c.densidad+' — '+c.densidad_nombre,c.supera?'⚠ SUPERA':'✓ OK'];}
        },
        backgroundColor:'#132044',titleColor:'#e8eaf6',bodyColor:'#8892bb',borderColor:'rgba(255,255,255,0.1)',borderWidth:1
      }},
      scales:{
        x:{stacked:true,ticks:{color:'#8892bb',font:{size:9},maxRotation:45,autoSkip:false},grid:{color:'rgba(255,255,255,0.05)'}},
        y:{stacked:true,ticks:{color:'#8892bb',font:{size:10}},grid:{color:'rgba(255,255,255,0.07)'}}
      }
    }
  });
}

function onDateChange(){
  var d=document.getElementById('sel-desde').value;
  var h=document.getElementById('sel-hasta').value;
  if(!d||!h||d>h) return;
  var yD=d.slice(0,4),yH=h.slice(0,4);
  document.getElementById('titulo-año').textContent=yD===yH?'SAIDI AÑO '+yD:'SAIDI '+d+' → '+h;
  var v=calcEmpresa(d,h);
  renderEmpresa(v);
}

function fmChanged(){
  var d=document.getElementById('fm-desde').value;
  var h=document.getElementById('fm-hasta').value;
  if(!d||!h||d>h) return;
  document.getElementById('fm-tag').textContent=d+' → '+h;
  renderComunas(d,h);
}

function init(){
  var defDesde=FECHA_MAX.slice(0,4)+'-01-01';
  document.getElementById('sel-desde').value=defDesde;
  document.getElementById('sel-hasta').value=FECHA_MAX;
  document.getElementById('fm-desde').value=FM_DESDE_DEF;
  document.getElementById('fm-hasta').value=FM_HASTA_DEF;
  document.getElementById('fm-tag').textContent=FM_DESDE_DEF+' → '+FM_HASTA_DEF;
  document.getElementById('titulo-año').textContent='SAIDI AÑO '+FECHA_MAX.slice(0,4);
  document.getElementById('footer').textContent='Datos hasta: '+FECHA_MAX+' · CHQ';
  var v=calcEmpresa(defDesde,FECHA_MAX);
  renderEmpresa(v);
  renderComunas(FM_DESDE_DEF,FM_HASTA_DEF);
}

window.addEventListener('load',init);
</script>
